name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare data dir and export env
        run: |
          mkdir -p "$RUNNER_TEMP/forge_data"
          ls -la "$RUNNER_TEMP/forge_data"
          echo "DATA_DIR=$RUNNER_TEMP/forge_data" >> $GITHUB_ENV
          echo "FORGE_FALLBACK_DATA_DIR=$RUNNER_TEMP/forge_data" >> $GITHUB_ENV
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest -q
